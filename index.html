<!DOCTYPE html>
<html>
  <head>
    <title>Countdown Timer</title>
  </head>
  <body>
    <h1>Countdown Timer</h1>
    <p>This is my countdown-timer project.</p>

    <input type="number" id="timeInput" placeholder="Seconds">
    <button onclick="startCountdown()">Start</button>

    <h2 id="timerDisplay">0</h2>

    <script>
      let countdown;

      function startCountdown() {
        clearInterval(countdown);
        let time = parseInt(document.getElementById('timeInput').value);
        if (isNaN(time) || time <= 0) return;
        document.getElementById('timerDisplay').textContent = time;

        countdown = setInterval(() => {
          time--;
          document.getElementById('timerDisplay').textContent = time;
          if (time <= 0) {
            clearInterval(countdown);
            alert("Time's up!");
          }
        }, 1000);
      }
    </script>
  </body>
</html>
